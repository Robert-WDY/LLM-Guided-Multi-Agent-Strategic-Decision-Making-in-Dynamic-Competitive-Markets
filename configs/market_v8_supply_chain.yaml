extends: market_v7_consumer_calibrated.yaml

config_id: market-v8-supply-chain
config_version: market-v8.0.0
environment_version: market-env-v8.0.0

schema_versions:
  state: market-state-v8.0.0
  action: company-action-v8.0.0

action:
  bounds:
    primary_supplier_share_ppm: {min: 0, max: 1000000}

supply_chain:
  enabled: true
  protocol_version: supply-chain-v1.0.0
  default_supplier_id: economy_supplier
  baseline_input_price_cents: 2100
  downstream_input_cost_share_ppm: 400000
  disruption_capacity_ppm: 300000
  suppliers:
    economy_supplier:
      label: 低价波动型供应商
      unit_price_cents: 1800
      unit_cost_cents: 1400
      base_capacity_orders: 11000
      reliability_ppm: 780000
    resilient_supplier:
      label: 稳健保障型供应商
      unit_price_cents: 2400
      unit_cost_cents: 1700
      base_capacity_orders: 11000
      reliability_ppm: 960000

calibration_metadata:
  status: synthetic_prior_pending_external_data
  supply_chain_claim_boundary: >-
    Supplier prices, capacities and reliability are synthetic mechanism-test
    parameters and are not calibrated to a real industry.
