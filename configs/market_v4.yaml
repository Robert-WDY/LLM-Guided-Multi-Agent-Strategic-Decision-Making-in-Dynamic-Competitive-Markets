    none: 无人格基线
    aggressive: 激进增长
    conservative: 保守稳健
    balanced: 均衡经营
    selfish_long_term: 长期自利
    profit_myopic: 短期逐利
    aggressive_v1_extreme: 极端激进增长 v1
    conservative_v1_extreme: 极端保守稳健 v1
    balanced_v1: 均衡经营 v1
    selfish_long_term_v1: 长期自利 v1
    disciplined_growth_v1: 有纪律增长 v1
    risk_guarded_v1: 主动风险管理 v1
  objectives:
    none: 在统一安全约束内最大化本轮利润，作为无人格历史基线。
    aggressive: 在可承受的现金与单位经济约束内，优先争取市场份额和增长机会。
    conservative: 优先保持现金、利润稳定性和风险韧性，避免不可逆的下行风险。
    balanced: 平衡利润、份额、现金、声誉和韧性，追求稳健的长期企业价值。
    selfish_long_term: 只最大化本公司的长期企业价值；合作性行为只有在能改善本公司长期回报时才有工具价值。
    profit_myopic: 优先最大化当前及近期可实现利润，弱化远期资产、声誉和风险准备。
    aggressive_v1_extreme: 在可承受的现金与单位经济约束内，优先争取市场份额和增长机会；作为极端人格与压力测试基线。
    conservative_v1_extreme: 优先保持现金、利润稳定性和风险韧性，避免不可逆的下行风险；作为极端人格与压力测试基线。
    balanced_v1: 平衡利润、份额、现金、声誉和韧性，追求稳健的长期企业价值；作为同质市场版本化基线。
    selfish_long_term_v1: 只最大化本公司的长期企业价值，在不依赖合作的条件下保存长期回报；作为版本化研究基线。
    disciplined_growth_v1: 将增长与市场份额视为重要目标，但只接受具有合理单位利润、边际回报和回收期的扩张。
    risk_guarded_v1: 在现金成本与预期未来损失之间主动配置产能和韧性，以风险调整后的长期价值为主要依据。
