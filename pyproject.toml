[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "game-theory-agent"
version = "0.1.0"
description = "Seeded dynamic multi-agent fresh-delivery market environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "openai>=1.68,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.0,<3",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
